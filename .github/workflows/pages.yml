name: Deploy Documentation Site

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing the verified website archive (defaults to the marketplace catalog tag).
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify release website archive
    if: >-
      github.server_url == 'https://github.com' &&
      github.repository == 'github/evals' &&
      (github.event_name == 'workflow_dispatch' || vars.EVALS_PAGES_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Download and verify website release archive
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${RELEASE_TAG:-}}"
          if [ -z "$TAG" ]; then
            TAG="$(node -e 'const fs = require("node:fs"); const c = JSON.parse(fs.readFileSync(".github/plugin/marketplace.json", "utf8")); process.stdout.write(c.plugins[0].source.ref);')"
          fi
          case "$TAG" in
            copilot-evals-v[0-9]*.[0-9]*.[0-9]*) VERSION="${TAG#copilot-evals-v}" ;;
            *) echo "Invalid release tag: $TAG" >&2; exit 1 ;;
          esac
          ARCHIVE="github-copilot-evals-website-${VERSION}.zip"
          mkdir -p artifacts/download artifacts/site
          gh release download "$TAG" --repo github/evals --dir artifacts/download --pattern "$ARCHIVE" --pattern "WEBSITE-SHA256SUMS"
          (cd artifacts/download && sha256sum -c WEBSITE-SHA256SUMS)
          unzip -q "artifacts/download/${ARCHIVE}" -d artifacts/site
          test -f artifacts/site/index.html
          test -f artifacts/site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      github.server_url == 'https://github.com' &&
      github.repository == 'github/evals' &&
      (github.event_name == 'workflow_dispatch' || vars.EVALS_PAGES_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
